<script>
/* Short link for Ask Shafaat (LinkedIn Featured, Instagram bio, anywhere a link loses its ?query).
   Sends the visitor to the homepage with the assistant open, tagged by where they came from. */
(function(){
  var r=(document.referrer||'').toLowerCase(), s='direct', m='none';
  if(/linkedin\.|lnkd\.in/.test(r)){s='linkedin';m='social';}
  else if(/facebook\.|fb\.com|fb\.me|m\.me/.test(r)){s='facebook';m='social';}
  else if(/instagram\./.test(r)){s='instagram';m='social';}
  else if(/t\.co|twitter\.|x\.com/.test(r)){s='x';m='social';}
  else if(/whatsapp|wa\.me/.test(r)){s='whatsapp';m='social';}
  else if(/google\.|bing\.|duckduckgo/.test(r)){s='search';m='organic';}
  else if(r){try{s=new URL(r).hostname.replace(/^www\./,'');m='referral';}catch(e){}}
  location.replace('/?ask=1&utm_source='+encodeURIComponent(s)+'&utm_medium='+m+'&utm_campaign=ask-link&utm_content=ask');
})();
</script>
